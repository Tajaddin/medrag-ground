[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medrag-ground"
version = "0.1.0"
description = "Audit-logged RAG over OpenFDA drug labels with mandatory citation grounding and PII detection. Healthcare-shaped regulated-workflow proxy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tajaddin Gafarov", email = "gafarovtajaddin@gmail.com" }]
keywords = ["llm", "rag", "healthcare", "openfda", "pii", "audit-log", "citation-grounding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
fastembed = ["fastembed>=0.4"]
groq = ["groq>=0.10"]
anthropic = ["anthropic>=0.39"]
server = ["fastapi>=0.110", "uvicorn>=0.30"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/Tajaddin/medrag-ground"
Repository = "https://github.com/Tajaddin/medrag-ground"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
